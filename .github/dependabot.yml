# Security updates only: version-update PRs are off (limit 0); fixes for
# known vulnerabilities arrive as one grouped PR per ecosystem.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
