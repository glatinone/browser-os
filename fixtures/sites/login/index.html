<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in</title></head>
<body>
<main>
  <h1>Sign in</h1>
  <form id="step1" onsubmit="event.preventDefault();document.getElementById('step1').hidden=true;document.getElementById('step2').hidden=false;">
    <p><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username"></p>
    <p><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password"></p>
    <p><button type="submit">Next</button></p>
  </form>
  <form id="step2" hidden onsubmit="event.preventDefault();document.getElementById('step2').hidden=true;document.getElementById('welcome').hidden=false;">
    <p><label for="otp">Verification code</label><input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code"></p>
    <p><button type="submit">Verify</button></p>
  </form>
  <h2 id="welcome" hidden>Welcome</h2>
</main>

</body>
</html>
