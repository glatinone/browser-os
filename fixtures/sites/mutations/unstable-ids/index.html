<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mutation base</title>
  </head>
  <body>
    <header><h1>Acme Mail</h1></header>
    <nav aria-label="Primary">
      <a href="#inbox">Inbox</a>
      <a href="#contacts">Contacts</a>
    </nav>
    <main>
      <section aria-label="Account">
        <h2>Account</h2>
        <button type="submit" id=":r9a:" class="btn btn-primary">Sign in</button>
        <button type="button" id=":r4f:" class="btn btn-ghost">Cancel</button>
      </section>
      <section aria-label="Messages">
        <h2>Messages</h2>
        <a href="#messages" id=":r2c:" class="badge"><span class="count">Messages 3</span></a>
        <a href="#archive" id=":r7b:" class="badge">Messages archive</a>
        <button type="button" aria-label="Settings" class="icon-btn">Settings</button>
      </section>
    </main>
  </body>
</html>
