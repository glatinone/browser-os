<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mutation base</title>
  </head>
  <body>
    <header><h1>Acme Mail</h1></header>
    <nav aria-label="Primary">
      <a href="#inbox">Inbox</a>
      <a href="#contacts">Contacts</a>
    </nav>
    <main>
      <section aria-label="Account">
        <h2>Account</h2>
        <div class="row">
          <div class="pad">
            <button type="submit" id="submit-1" class="btn btn-primary">Sign in</button>
          </div>
        </div>
        <button type="button" id="cancel-1" class="btn btn-ghost">Cancel</button>
      </section>
      <section aria-label="Messages">
        <h2>Messages</h2>
        <a href="#messages" id="badge-1" class="badge"><span class="count">Messages 3</span></a>
        <a href="#archive" id="archive-1" class="badge">Messages archive</a>
        <button type="button" aria-label="Settings" class="icon-btn">Settings</button>
      </section>
    </main>
  </body>
</html>
