<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Basic form page</title>
<style>
  .menu { position: relative; display: inline-block; }
  .menu-items { display: none; position: absolute; margin: 4px 0 0; padding: 4px 8px; list-style: none; border: 1px solid #888; background: #fff; }
  .menu:hover .menu-items, .menu:focus-within .menu-items { display: block; }
  .switch { position: relative; display: inline-block; }
  .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; }
  .switch label { position: relative; display: inline-block; padding: 4px 8px; border: 1px solid #888; }
</style>
</head>
<body>
<header>
  <nav aria-label="Main">
    <a href="/basic/">Home</a>
    <a href="/basic/docs">Docs</a>
    <a href="/basic/pricing">Pricing</a>
    <a href="/basic/contact">Contact</a>
  </nav>
  <div class="menu">
    <button type="button" id="menu-trigger" aria-haspopup="true">More</button>
    <ul class="menu-items">
      <li><a href="/basic/account">Account</a></li>
      <li><a href="/basic/billing">Billing</a></li>
    </ul>
  </div>
  <button type="button" aria-label="Settings">&#9881;</button>
</header>
<main>
  <h1>Create your account</h1>
  <form action="/echo" method="post">
    <p><label for="name">Full name</label>
       <input id="name" name="name" type="text" autocomplete="name"></p>
    <p><input id="email" name="email" type="email" placeholder="you@example.com"></p>
    <p><label for="country">Country</label>
       <select id="country" name="country">
         <option value="">Choose a country</option>
         <option value="id">Indonesia</option>
         <option value="sg">Singapore</option>
         <option value="jp">Japan</option>
       </select></p>
    <fieldset>
      <legend>Plan</legend>
      <label><input type="radio" name="plan" value="monthly"> Monthly</label>
      <label><input type="radio" name="plan" value="yearly"> Yearly</label>
    </fieldset>
    <p><label><input id="newsletter" name="newsletter" type="checkbox" value="yes"> Send me the newsletter</label></p>
    <p><label><input id="terms" name="terms" type="checkbox" value="yes"> I agree to the terms</label></p>
    <p><label for="notes">Notes</label><textarea id="notes" name="notes" rows="3"></textarea></p>
    <p><button type="submit">Create account</button>
       <button type="button" disabled>Delete everything</button></p>
    <p class="switch">
      <input id="switch" name="switch" type="checkbox" value="yes">
      <label for="switch">Enable the beta features</label>
    </p>
  </form>
  <p><button id="probe" type="button">Probe</button> <span id="probe-log">-</span></p>
</main>
<div style="height:1500px"></div>
<p><button id="far-button" type="button">Far away</button></p>
<script>
    const probeLog = document.getElementById('probe-log');
    const record = (text) => { probeLog.textContent = text; };
    document.getElementById('probe').addEventListener('click', () => record('click'));
    document.getElementById('probe').addEventListener('dblclick', () => record('dblclick'));
    document.getElementById('probe').addEventListener('contextmenu', () => record('contextmenu'));
    document.getElementById('far-button').addEventListener('click', () => record('far-click'));
  </script>

<p><label for="controlled">Controlled</label>
   <input id="controlled" name="controlled" type="text"></p>
<p><label for="locked">Locked</label>
   <input id="locked" name="locked" type="text" readonly></p>
<script>
  // A framework-style controlled field: the value lives in JS, it is accepted from an `input`
  // event, and anything that changed the field without saying so is written back over.
  const controlled = document.getElementById('controlled');
  let controlledState = '';
  controlled.addEventListener('input', () => { controlledState = controlled.value; });
  setInterval(() => {
    if (controlled.value !== controlledState) controlled.value = controlledState;
  }, 25);
</script>
</body>
</html>
